name: One-shot balanced reading, stronger open model

on:
  push:
    paths:
      - 'experiments/launch-balanced-reading-2026-11-05.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  balanced-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and pinned CPU model runtime
        run: |
          python -m pip install -e .
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install 'transformers==4.57.1' 'safetensors==0.5.3' 'accelerate==1.10.1'
      - name: Validate no-inference reference and constant-output controls
        run: |
          python scripts/run_balanced_controls.py
          python scripts/run_balanced_reading.py --participant oracle --output .runs/oracle-reading.json
          python scripts/run_balanced_reading.py --participant zero --output .runs/constant-reading.json
          python scripts/verify_balanced_reading.py .runs/oracle-reading.json .runs/constant-reading.json
      - name: Single-sample weight interpretation, two predeclared prompt conditions
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/run_balanced_reading.py --condition direct --participant model --output .runs/reading-direct.json
          python scripts/run_balanced_reading.py --condition deliberate --participant model --output .runs/reading-deliberate.json
          python scripts/verify_balanced_reading.py .runs/reading-direct.json .runs/reading-deliberate.json
      - name: Preserve artifacts even on inference failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balanced-reading-model-and-controls
          path: .runs/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Archive completed experimental evidence directly on main
        if: success()
        run: |
          mkdir -p experiments/reports
          cp .runs/reading-direct.json experiments/reports/2026-11-05-balanced-reading-direct.json
          cp .runs/reading-deliberate.json experiments/reports/2026-11-05-balanced-reading-deliberate.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/reports/2026-11-05-balanced-reading-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive balanced model-reading pilot results (exploratory)'
            git push origin HEAD:main
          fi
