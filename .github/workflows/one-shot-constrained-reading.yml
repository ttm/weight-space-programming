name: One-shot constrained-output reading follow-up

on:
  push:
    paths:
      - 'experiments/launch-constrained-reading-2026-11-05.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  constrained-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model runtime from pinned packages
        run: |
          python -m pip install -e .
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install 'transformers==4.57.1' 'safetensors==0.5.3' 'accelerate==1.10.1'
      - name: Verify oracle and constant-decoder controls without model downloads
        run: |
          python scripts/run_constrained_reading.py --participant oracle --output .runs/constrained-oracle.json
          python scripts/run_constrained_reading.py --participant zero --output .runs/constrained-zero.json
          python scripts/verify_constrained_reading.py .runs/constrained-oracle.json .runs/constrained-zero.json
      - name: Constrained 0/1 token inference (16 exact bits per presentation)
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/run_constrained_reading.py --participant model --output .runs/constrained-model.json
          python scripts/verify_constrained_reading.py .runs/constrained-model.json
      - name: Preserve outputs on any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constrained-output-reading
          path: .runs/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
      - name: Commit verified inference record directly to main
        if: success()
        run: |
          mkdir -p experiments/reports
          cp .runs/constrained-model.json experiments/reports/2026-11-05-constrained-reading.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/reports/2026-11-05-constrained-reading.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive constrained-output weight-reading follow-up (exploratory)'
            git push origin HEAD:main
          fi
