name: Validate weight-space experiments

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce benchmark
        run: python -m wsp benchmark --directory examples --random-trials 30 --output results/initial_benchmark.json
      - name: Reproduce repair
        run: python -m wsp repair fixtures/xor2_corrupted.json repairs/xor2_bias_fix.json --output results/xor2_repair.json
      - name: Reproduce perturbation checks
        run: python -m wsp stress examples/xor2.json --output results/xor2_stress.json
      - name: Committed results match exactly
        run: git diff --exit-code -- results/
