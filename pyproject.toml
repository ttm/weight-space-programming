[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-space-programming"
version = "0.2.0"
description = "A controlled, dependency-free benchmark for directly specified neural network weights"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wsp = "wsp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
